# Fly.io settings for the hosted demo. Set the app name with: fly launch --no-deploy --copy-config
# The password is a secret, never in this file:  fly secrets set SCOPEWATCH_PASSWORD=...
app = "scopewatch-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # sleeps when nobody is using it; wakes on the next visit
  auto_start_machines = true
  min_machines_running = 0        # set to 1 during judging (Jan 27 - Feb 3) so judges never wait

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
